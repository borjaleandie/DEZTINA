<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — DESTINA</title>
  <meta name="description" content="Create a free DESTINA account to save favorites, write reviews, and get destination recommendations.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body data-page="register" data-base="" class="bg-white">

  <div id="navbar-root"></div>

  <section class="mx-auto flex min-h-[80vh] max-w-md flex-col justify-center px-6 py-16">
    <div class="mb-8 text-center">
      <i data-lucide="compass" class="mx-auto h-8 w-8 text-coral"></i>
      <h1 class="mt-3 font-display text-3xl font-semibold text-tide">Create your account</h1>
      <p class="mt-2 text-sm text-ink/60">Join DESTINA and start planning your next trip.</p>
    </div>

    <form id="register-form" class="card space-y-5 p-8" novalidate>
      <div>
        <label class="label-field" for="fullName">Full name</label>
        <input id="fullName" name="fullName" type="text" required class="input-field" placeholder="Juan Dela Cruz">
      </div>
      <div>
        <label class="label-field" for="email">Email</label>
        <input id="email" name="email" type="email" required class="input-field" placeholder="you@example.com">
      </div>
      <div>
        <label class="label-field" for="password">Password</label>
        <input id="password" name="password" type="password" required class="input-field" placeholder="At least 8 characters">
      </div>
      <div>
        <label class="label-field" for="confirmPassword">Confirm password</label>
        <input id="confirmPassword" name="confirmPassword" type="password" required class="input-field" placeholder="Re-enter your password">
      </div>

      <button type="submit" id="register-submit" class="btn-primary w-full">Create Account</button>

      <p class="text-center text-sm text-ink/60">
        Already have an account?
        <a href="login.html" class="font-medium text-coral hover:underline">Log in</a>
      </p>
    </form>
  </section>

  <div id="footer-root"></div>

  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.getElementById("register-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById("register-submit");
      submitBtn.disabled = true;
      submitBtn.textContent = "Creating account...";

      const result = await registerUser({
        fullName: document.getElementById("fullName").value.trim(),
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value,
        confirmPassword: document.getElementById("confirmPassword").value
      });

      showToast(result.message, result.success ? "success" : "error");
      submitBtn.disabled = false;
      submitBtn.textContent = "Create Account";

      if (result.success) {
        setTimeout(() => { window.location.href = "index.html"; }, 800);
      }
    });
  </script>
</body>
</html>
