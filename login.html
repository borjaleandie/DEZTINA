<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — DESTINA</title>
  <meta name="description" content="Log in to your DESTINA account to save favorites, write reviews, and get personalized recommendations.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body data-page="login" data-base="" class="bg-white">

  <div id="navbar-root"></div>

  <section class="mx-auto flex min-h-[80vh] max-w-md flex-col justify-center px-6 py-16">
    <div class="mb-8 text-center">
      <i data-lucide="compass" class="mx-auto h-8 w-8 text-coral"></i>
      <h1 class="mt-3 font-display text-3xl font-semibold text-tide">Welcome back</h1>
      <p class="mt-2 text-sm text-ink/60">Log in to continue exploring with DESTINA.</p>
    </div>

    <form id="login-form" class="card space-y-5 p-8" novalidate>
      <div>
        <label class="label-field" for="email">Email</label>
        <input id="email" name="email" type="email" required class="input-field" placeholder="you@example.com">
      </div>
      <div>
        <label class="label-field" for="password">Password</label>
        <input id="password" name="password" type="password" required class="input-field" placeholder="••••••••">
      </div>

      <button type="submit" id="login-submit" class="btn-primary w-full">Log In</button>

      <div class="flex items-center justify-between text-sm">
        <a href="#" id="forgot-password-link" class="text-tide/70 hover:text-coral">Forgot password?</a>
        <a href="register.html" class="font-medium text-coral hover:underline">Create account</a>
      </div>
    </form>
  </section>

  <div id="footer-root"></div>

  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const redirectTo = params.get("redirect") || "index.html";

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById("login-submit");
      submitBtn.disabled = true;
      submitBtn.textContent = "Logging in...";

      const result = await loginUser({
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value
      });

      showToast(result.message, result.success ? "success" : "error");
      submitBtn.disabled = false;
      submitBtn.textContent = "Log In";

      if (result.success) {
        setTimeout(() => { window.location.href = redirectTo; }, 600);
      }
    });

    document.getElementById("forgot-password-link").addEventListener("click", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      if (!email) {
        showToast("Enter your email above first, then click 'Forgot password?' again.", "info");
        return;
      }
      const result = await sendPasswordReset(email);
      showToast(result.message, result.success ? "success" : "error");
    });
  </script>
</body>
</html>
